# ==============================================================================
# Supabase Configuration for EgolePay / Invoice Generator
# ==============================================================================
project_id = "egolepay-invoice-generator"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

# Storage Bucket 1: Business logos (Public read)
[storage.buckets.logos]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/svg+xml", "image/webp"]

# Storage Bucket 2: Generated invoice PDFs & receipts (Private/Protected)
[storage.buckets.invoices]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["application/pdf"]

[edge_runtime]
enabled = true
port = 54324
